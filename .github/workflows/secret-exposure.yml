name: Secret exposure guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-public-client-config:
    name: Prevent privileged client secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-no-client-secrets.mjs
