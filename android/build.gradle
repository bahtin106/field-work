// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.2')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url = uri(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url = uri('https://www.jitpack.io') }
  }
}

// Expo SDK 54 pins keyboard-controller 1.18.5. Its Android sources retain
// compatibility guards below this app's minSdk 24, which Android lint reports
// as ObsoleteSdkInt errors. Limit the suppression to that third-party module;
// application lint remains strict.
subprojects { subproject ->
  afterEvaluate {
    if (subproject.name == 'react-native-keyboard-controller' && subproject.hasProperty('android')) {
      subproject.android.lint {
        disable 'ObsoleteSdkInt'
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
